name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Fetch Syncthing v2.1.7
        shell: pwsh
        run: ./scripts/fetch-syncthing.ps1

      - name: Build portable package
        shell: pwsh
        run: ./build.ps1 -SelfContained

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccDock-win-x64
          path: dist/ccDock
          if-no-files-found: error
          retention-days: 30

      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $zip = "ccDock-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path "dist/ccDock/*" -DestinationPath $zip
          "RELEASE_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:RELEASE_ZIP --clobber
          }
          else {
            gh release create $tag $env:RELEASE_ZIP `
              --title "ccDock $tag" `
              --notes "ccDock $tag · Windows x64 自包含版本（内置 Syncthing v2.1.7）。`n`n下载 zip 解压后运行 ccDock.exe 即可。"
          }
